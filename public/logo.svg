<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- EdNxt Modern Abstract Emblem: Represents Ascent, Knowledge Layers & Future Growth -->
  <g transform="translate(4, 8)">
    <!-- Base Foundation Layer -->
    <path d="M6 38 L24 24 L34 32 L16 46 Z" fill="#102B50" />
    <!-- Progressive Growth Layer (Blue) -->
    <path d="M18 24 L34 10 L44 18 L28 32 Z" fill="#2563EB" />
    <!-- Peak / Future Spark Layer (Lime Accent) -->
    <path d="M30 11 L42 2 L50 8 L38 18 Z" fill="#B4E94E" />
    <!-- Dynamic Forward Spark -->
    <circle cx="45" cy="5" r="3.5" fill="#2563EB" />
  </g>
  <!-- Typography: EDNXT with Clean Contemporary Proportions -->
  <text x="68" y="42" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.03em" fill="#0B2142">
    ED<tspan fill="#2563EB">NXT</tspan>
  </text>
  <!-- Micro Tagline under logo -->
  <text x="70" y="54" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="0.18em" fill="#64748B">
    ACADEMY
  </text>
</svg>
