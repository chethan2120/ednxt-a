<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="ai-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="60%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>
    <radialGradient id="ai-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#090514" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ai-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Outer Base Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#ai-bg)" stroke="url(#ai-ring)" stroke-width="6"/>

  <!-- Circuit Matrix Ring & Binary Markers -->
  <g stroke="rgba(192,132,252,0.25)" stroke-width="1.2">
    <circle cx="250" cy="250" r="226" fill="none" stroke-dasharray="4,8"/>
    <circle cx="250" cy="250" r="195" fill="none"/>
    <circle cx="250" cy="250" r="150" fill="none" stroke-dasharray="2,6"/>
  </g>

  <!-- Binary Ring Segments -->
  <g fill="#A855F7" font-family="monospace" font-size="9" opacity="0.45">
    <text x="250" y="38" text-anchor="middle">0 1 0 0 1 1 0 1</text>
    <text x="250" y="470" text-anchor="middle">1 0 1 1 0 0 1 0</text>
    <text x="35" y="253" text-anchor="middle">0 1 1</text>
    <text x="465" y="253" text-anchor="middle">1 0 1</text>
  </g>

  <!-- Neural Network Topology (Nodes & Synaptic Lines) -->
  <g stroke="rgba(56,189,248,0.4)" stroke-width="2">
    <!-- Input layer to Hidden -->
    <line x1="140" y1="170" x2="200" y2="130"/>
    <line x1="140" y1="170" x2="200" y2="250"/>
    <line x1="140" y1="250" x2="200" y2="130"/>
    <line x1="140" y1="250" x2="200" y2="250"/>
    <line x1="140" y1="250" x2="200" y2="370"/>
    <line x1="140" y1="330" x2="200" y2="250"/>
    <line x1="140" y1="330" x2="200" y2="370"/>
    
    <!-- Hidden to Core -->
    <line x1="200" y1="130" x2="250" y2="200"/>
    <line x1="200" y1="250" x2="250" y2="250"/>
    <line x1="200" y1="370" x2="250" y2="300"/>

    <!-- Core to Output -->
    <line x1="250" y1="200" x2="300" y2="130"/>
    <line x1="250" y1="250" x2="300" y2="250"/>
    <line x1="250" y1="300" x2="300" y2="370"/>
    <line x1="300" y1="130" x2="360" y2="170"/>
    <line x1="300" y1="250" x2="360" y2="170"/>
    <line x1="300" y1="250" x2="360" y2="250"/>
    <line x1="300" y1="250" x2="360" y2="330"/>
    <line x1="300" y1="370" x2="360" y2="330"/>
  </g>

  <!-- Neural Nodes -->
  <g fill="#38BDF8">
    <circle cx="140" cy="170" r="5"/>
    <circle cx="140" cy="250" r="5"/>
    <circle cx="140" cy="330" r="5"/>
    <circle cx="200" cy="130" r="6" fill="#C084FC"/>
    <circle cx="200" cy="250" r="6" fill="#C084FC"/>
    <circle cx="200" cy="370" r="6" fill="#C084FC"/>
    <circle cx="300" cy="130" r="6" fill="#C084FC"/>
    <circle cx="300" cy="250" r="6" fill="#C084FC"/>
    <circle cx="300" cy="370" r="6" fill="#C084FC"/>
    <circle cx="360" cy="170" r="5"/>
    <circle cx="360" cy="250" r="5"/>
    <circle cx="360" cy="330" r="5"/>
  </g>

  <!-- Center Core AI Glow -->
  <circle cx="250" cy="250" r="75" fill="url(#ai-glow)"/>

  <!-- Microprocessor / Intelligent Brain Chip Emblem -->
  <g transform="translate(205, 205)" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="70" height="70" rx="14" fill="#1E1B4B" stroke="#C084FC" stroke-width="3"/>
    <!-- Chip pins -->
    <line x1="25" y1="2" x2="25" y2="10" stroke="#38BDF8"/>
    <line x1="45" y1="2" x2="45" y2="10" stroke="#38BDF8"/>
    <line x1="65" y1="2" x2="65" y2="10" stroke="#38BDF8"/>
    <line x1="25" y1="80" x2="25" y2="88" stroke="#38BDF8"/>
    <line x1="45" y1="80" x2="45" y2="88" stroke="#38BDF8"/>
    <line x1="65" y1="80" x2="65" y2="88" stroke="#38BDF8"/>
    <line x1="2" y1="25" x2="10" y2="25" stroke="#38BDF8"/>
    <line x1="2" y1="45" x2="10" y2="45" stroke="#38BDF8"/>
    <line x1="2" y1="65" x2="10" y2="65" stroke="#38BDF8"/>
    <line x1="80" y1="25" x2="88" y2="25" stroke="#38BDF8"/>
    <line x1="80" y1="45" x2="88" y2="45" stroke="#38BDF8"/>
    <line x1="80" y1="65" x2="88" y2="65" stroke="#38BDF8"/>
    
    <!-- Central Brain / Sparkle Vector inside chip -->
    <path d="M45 28 L49 39 L60 43 L49 47 L45 58 L41 47 L30 43 L41 39 Z" fill="#B4E94E" stroke="#B4E94E" stroke-width="1.5"/>
  </g>

  <!-- Bottom AI Badge -->
  <rect x="165" y="385" width="170" height="36" rx="18" fill="rgba(9,5,20,0.85)" stroke="#C084FC" stroke-width="1.5"/>
  <text x="250" y="408" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2">APPLIED AI & TOOLS</text>
</svg>
